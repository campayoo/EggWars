# EGG WARS — despliegue online en Render (Blueprint)
# © 2026 Pablo Campayo Viñes. Todos los derechos reservados.
# Render → New → Blueprint → elige el repo EggWars → Apply.
services:
  - type: web
    name: eggwars
    runtime: node
    plan: free
    region: frankfurt          # el más cercano a España
    branch: main
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: node server.js --prod
    healthCheckPath: /healthz
    autoDeploy: true           # cada push a main se publica solo
    envVars:
      - key: NODE_ENV
        value: production
      - key: EGG_PUBLIC
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGINS   # la web de Vercel también puede conectarse
        value: https://eggwars-ten.vercel.app
      - key: DATABASE_URL      # las cuentas se guardan en PostgreSQL
        fromDatabase:
          name: eggwars-db
          property: connectionString

databases:
  - name: eggwars-db
    plan: free
    region: frankfurt
    databaseName: eggwars
    ipAllowList: []            # sólo accesible desde dentro de Render
